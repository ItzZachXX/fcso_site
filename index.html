<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayette County Sheriff's Office</title>
  <meta name="description" content="Fayette County Sheriff's Office - Kentucky State Roleplay. Website coming soon.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1420;
      --bg-2: #13202f;
      --gold: #c9a24a;
      --gold-light: #e2c275;
      --text: #e8ecf1;
      --muted: #8f9bab;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 65%);
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 640px;
      width: 100%;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 6px 24px rgba(201, 162, 74, 0.25));
    }

    .dept {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
    }

    .status {
      font-family: "Oswald", sans-serif;
      font-weight: 500;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .blurb {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 460px;
    }

    .btn {
      margin-top: 8px;
      display: inline-block;
      padding: 14px 32px;
      background: var(--gold);
      color: #111;
      font-family: "Oswald", sans-serif;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--gold-light);
      transform: translateY(-2px);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Fayette County Sheriff's Office logo" onerror="this.style.display='none'">
    <h1 class="dept">Fayette County<br>Sheriff's Office</h1>
    <div class="divider"></div>
    <p class="status">Coming Soon</p>
    <p class="blurb">Our new website is under construction. In the meantime, join us on Discord to stay up to date.</p>
    <a class="btn" href="https://discord.gg/nMPwQ7AFHk" target="_blank" rel="noopener">Join Our Discord</a>
  </main>
  <footer>
    &copy; <span id="year"></span> Fayette County Sheriff's Office &middot; Kentucky State Roleplay
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
